# Steps: Node, qa-platform dependencies and Claude Code.
parameters:
  - name: qaRoot
    type: string
    default: $(Build.SourcesDirectory)
  - name: nodeVersion
    type: string
    default: 22.x

steps:
  - task: UseNode@1
    displayName: Use Node ${{ parameters.nodeVersion }}
    inputs:
      version: ${{ parameters.nodeVersion }}

  - bash: npm ci --no-fund --no-audit
    displayName: Install qa-platform
    workingDirectory: ${{ parameters.qaRoot }}

  - bash: |
      set -euo pipefail
      version="${CLAUDE_CODE_VERSION:-latest}"
      case "$version" in '$('*) version=latest ;; esac   # variable not defined in the group
      npm install -g "@anthropic-ai/claude-code@${version}" --no-fund --no-audit
      claude --version
    displayName: Install Claude Code
    condition: and(succeeded(), ne(variables['QA_AI_GATES'], 'off'))
    env:
      CLAUDE_CODE_VERSION: $(CLAUDE_CODE_VERSION)
